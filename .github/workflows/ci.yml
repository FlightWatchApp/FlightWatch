name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: G1 - Format check
        run: pnpm format:check

      - name: G1 - Lint
        run: pnpm lint

      - name: G2 - Typecheck
        run: pnpm typecheck

      - name: G3 - Unit tests
        run: pnpm test
