name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um push novo na mesma branch cancela a execução anterior, ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem de `packageManager` no package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: G1 - Format check
        run: pnpm format:check

      # Falhas conhecidas nas dependências de produção. Só avisa por enquanto: as
      # do NestJS 10/Fastify saem com a atualização para o NestJS 11; depois
      # disso, tirar o continue-on-error para bloquear o merge.
      - name: Security - Dependency audit
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: G1 - Lint
        run: pnpm lint

      - name: G2 - Typecheck
        run: pnpm typecheck

      # Testes de integração e e2e (database, queue, api, workers) sobem
      # PostgreSQL/Redis reais via Testcontainers, usando o Docker do runner.
      - name: G3/G4 - Unit and integration tests
        run: pnpm test

      - name: Design system checks
        run: pnpm check:design

      - name: G9 - Build
        run: pnpm build

  # E2E no navegador (apps/e2e): stack completa com provedores simulados, banco e
  # Redis próprios. O catálogo de lugares é baixado da fonte pública no startup do
  # scheduler (precisa de rede).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flight_watch
          POSTGRES_PASSWORD: flight_watch
          POSTGRES_DB: flight_watch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U flight_watch" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flight-watch/e2e exec playwright install --with-deps chromium
      - name: E2E
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/e2e/test-results

  # SPEC-028: garante que o Dockerfile continua construindo. Sem push — a
  # publicação da imagem entra com a escolha da plataforma.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build --target api -t flight-watch-api:ci .

      - name: Build web image
        run: docker build --target web -t flight-watch-web:ci .
